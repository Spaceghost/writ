      - name: Prepare public evidence directory and verify tooling
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/writ-nested-negative" "$RUNNER_TEMP/writ-nested-negative-raw"
          test "$(git -C "$GITHUB_WORKSPACE/ci-tooling" rev-parse HEAD)" = "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE/ci-tooling" status --porcelain --untracked-files=normal > "$RUNNER_TEMP/writ-nested-negative/tooling-status.txt"
          stat -c '%d:%i:%u' "$RUNNER_TEMP/writ-nested-negative-raw" > "$RUNNER_TEMP/writ-nested-negative/raw-directory-id.txt"
          test ! -s "$RUNNER_TEMP/writ-nested-negative/tooling-status.txt"
          sha256sum "$GITHUB_WORKSPACE/ci-tooling/contrib/native-hosts/genode/nested-channel/ci-disposable.sh" \
            "$GITHUB_WORKSPACE/ci-tooling/contrib/native-hosts/genode/nested-channel/ci-log-capture.sh" \
            "$GITHUB_WORKSPACE/ci-tooling/contrib/native-hosts/genode/nested-channel/ci-snapshot.mjs" \
            > "$RUNNER_TEMP/writ-nested-negative/tooling-sha256.txt"
          printf 'workflow_sha=%s\nworkflow_ref=%s\nrun_id=%s\nattempt=%s\nrunner_image=%s %s\n' \
            "$GITHUB_SHA" "$GITHUB_REF" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "$ImageOS" "$ImageVersion" > "$RUNNER_TEMP/writ-nested-negative/workflow-identity.txt"
      - name: Install public build dependencies
        timeout-minutes: 10
        run: |
