          $binaryHashes = @(Get-FileHash (Join-Path $build 'Release\writfs-pss-init-observer.exe'),(Join-Path $build 'Release\writfs-pss-init-control.exe'),(Join-Path $build 'Release\writfs-init-child.exe'),(Join-Path $build 'Release\writfs-pss-table-test.exe'),(Join-Path $build 'Release\writfs-pss-init-progress-test.exe'),(Join-Path $build 'Release\writfs-pss-init-pipe-test.exe') -Algorithm SHA256)
          if ($binaryHashes.Count -ne 6) { throw 'Expected all six same-lifetime binary hashes.' }
          $binaryHashes | Format-List | Out-File (Join-Path $logs 'binaries.txt') -Encoding utf8
      - name: Verify child PE dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $logs = Join-Path $env:RUNNER_TEMP 'windows-pss-init-logs'
          $log = Join-Path $logs 'child-dependencies.txt'
          try {
            $child = Join-Path $env:RUNNER_TEMP 'windows-pss-init-build\Release\writfs-init-child.exe'
            $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
            if (-not (Test-Path $vswhere) -or -not (Test-Path $child)) { throw 'vswhere or child image missing.' }
            $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            if ($LASTEXITCODE -ne 0 -or -not $vs) { throw 'MSVC installation not found.' }
            $devcmd = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
            $dumpbin = Get-ChildItem (Join-Path $vs 'VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe') | Sort-Object FullName -Descending | Select-Object -First 1
            if (-not (Test-Path $devcmd) -or -not $dumpbin) { throw 'Developer environment or dumpbin not found.' }
            $command = 'call "{0}" -no_logo -arch=x64 && "{1}" /dependents "{2}"' -f $devcmd,$dumpbin.FullName,$child
            $ErrorActionPreference = 'Continue'
            $dependencies = & cmd.exe /d /s /c $command 2>&1
            $dumpExit = $LASTEXITCODE
            $dependencies | Out-File $log -Encoding utf8
            if ($dumpExit -ne 0 -or -not ($dependencies -match '^\s*WS2_32\.dll\s*$') -or ($dependencies -match '^\s*(USER32|OLE32)\.dll\s*$')) {
