name: Writ policy on Windows Node

# This lane qualifies generated JavaScript execution, not a Windows filesystem,
# a native machine-code Bend runtime, or a protected Windows host profile.
on:
  push:
    branches:
      - master
      - writfs-native-ci
    paths:
      - '*.bend'
      - 'hosts/linux/monitor/**'
      - 'lib/**'
      - 'writfs/**'
      - 'contrib/rclone/bend/Authority.bend'
      - 'docs/INSTALL.md'
      - '.github/workflows/writfs-windows-policy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: ${{ github.ref != 'refs/heads/lane/windows-init-diagnostic' && github.ref != 'refs/heads/lane/windows-pss' && github.ref != 'refs/heads/lane/windows-pss-lpac' && github.ref != 'refs/heads/lane/windows-pss-init' && github.ref != 'refs/heads/lane/windows-registry-ab' }}
    name: Compile Bend policy tests to JavaScript
    runs-on: [self-hosted, linux, x64, bak]
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.generated.outputs.artifact-id }}
    env:
      BEND_NO_TELEMETRY: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Record build environment
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/writfs-windows-build-logs"
          {
            printf 'Commit: %s\n' "$GITHUB_SHA"
            printf 'Runner image: %s %s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
            uname -a
            cat /etc/os-release
          } 2>&1 | tee "$RUNNER_TEMP/writfs-windows-build-logs/environment.log"

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install and verify Bend 2.0.39
        run: |
          set -euo pipefail
          {
            writfs_bend_directory="$RUNNER_TEMP/writfs-windows-bend-2.0.39"
            mkdir -p "$writfs_bend_directory"
            curl --proto '=https' --tlsv1.2 --retry 3 -fL \
              https://github.com/bendlang/bend/releases/download/v2.0.39/bend-2.0.39-linux-x64.tar.gz \
              -o "$writfs_bend_directory/release.tar.gz"
            printf '%s  %s\n' \
              6cf462fd8f70b094a4950ebb709a9c4ffd8f1d1189d9cedf1fd63cd5d041c7ab \
              "$writfs_bend_directory/release.tar.gz" | sha256sum -c -
            tar -xzf "$writfs_bend_directory/release.tar.gz" -C "$writfs_bend_directory"
            writfs_bend_version="$("$writfs_bend_directory/bend/bin/bend" version)"
            printf '%s\n' "$writfs_bend_version"
            test "$writfs_bend_version" = 'bend 2.0.39'
            printf '%s\n' "$writfs_bend_directory/bend/bin" >> "$GITHUB_PATH"
          } 2>&1 | tee "$RUNNER_TEMP/writfs-windows-build-logs/bend-toolchain.log"

      - name: Compile the existing Bend suites outside the checkout
        run: |
          set -euo pipefail
          writfs_generated_directory="$RUNNER_TEMP/writfs-windows-generated"
          mkdir -p "$writfs_generated_directory"
          bend Tests.bend -o "$writfs_generated_directory/library-tests.js" \
            2>&1 | tee "$RUNNER_TEMP/writfs-windows-build-logs/library-compile.log"
          bend writfs/Tests.bend -o "$writfs_generated_directory/writfs-model-tests.js" \
            2>&1 | tee "$RUNNER_TEMP/writfs-windows-build-logs/writfs-model-compile.log"
          {
            printf 'Source commit: %s\n' "$GITHUB_SHA"
            bend version
            printf 'Entries: Tests.bend; writfs/Tests.bend\n'
            printf 'Scope: generated JavaScript policy/model tests on native Windows Node.\n'
          } > "$writfs_generated_directory/source.txt"
          (
            cd "$writfs_generated_directory"
            sha256sum library-tests.js writfs-model-tests.js
          ) | tee "$writfs_generated_directory/SHA256SUMS"

      - name: Retain generated test artifacts
        id: generated
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: writfs-windows-generated-${{ github.run_attempt }}
          path: ${{ runner.temp }}/writfs-windows-generated/
          if-no-files-found: error
          retention-days: 14

      - name: Retain build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: writfs-windows-build-${{ github.run_attempt }}
          path: ${{ runner.temp }}/writfs-windows-build-logs/
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Run generated Bend tests on native Windows Node
    needs: build
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Record Windows and Node environment
        run: |
          $ErrorActionPreference = 'Stop'
          $writfsLogDirectory = Join-Path $env:RUNNER_TEMP 'writfs-windows-logs'
          New-Item -ItemType Directory -Path $writfsLogDirectory -Force | Out-Null
          if (-not $IsWindows) { throw 'This lane requires native Windows PowerShell.' }
          $writfsNode = (Get-Command node.exe -CommandType Application).Source
          $writfsNodeVersion = & $writfsNode --version
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows Node could not start.' }
          $writfsOS = Get-CimInstance Win32_OperatingSystem
          @(
            "Commit: $env:GITHUB_SHA"
            "OS: $($writfsOS.Caption) $($writfsOS.Version) build $($writfsOS.BuildNumber)"
            "Architecture: $($writfsOS.OSArchitecture)"
            "Runner image: $env:ImageOS $env:ImageVersion"
            "PowerShell: $($PSVersionTable.PSVersion)"
            "Node executable: $writfsNode"
            "Node version: $writfsNodeVersion"
            'Execution: Bend-generated JavaScript under native Windows Node; no WSL.'
            'Scope: policy/model execution; filesystem, machine-code, and host-enforcement qualification remain separate.'
          ) | Tee-Object -FilePath (Join-Path $writfsLogDirectory 'environment.log')
          "WRITFS_NODE=$writfsNode" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download the exact generated artifact from the build job
        id: generated
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: ${{ runner.temp }}/writfs-windows-generated/
          merge-multiple: true
          digest-mismatch: error

      - name: Record generated artifact provenance
        run: |
          $ErrorActionPreference = 'Stop'
          $writfsGeneratedDirectory = Join-Path $env:RUNNER_TEMP 'writfs-windows-generated'
          $writfsLogDirectory = Join-Path $env:RUNNER_TEMP 'writfs-windows-logs'
          Get-Content (Join-Path $writfsGeneratedDirectory 'source.txt') |
            Tee-Object -FilePath (Join-Path $writfsLogDirectory 'source.log')
          Get-FileHash -Algorithm SHA256 -Path @(
            (Join-Path $writfsGeneratedDirectory 'library-tests.js')
            (Join-Path $writfsGeneratedDirectory 'writfs-model-tests.js')
          ) | Format-List | Out-String |
            Tee-Object -FilePath (Join-Path $writfsLogDirectory 'generated-hashes.log')

      - name: Run the Bend library tests
        id: library
        if: ${{ !cancelled() && steps.generated.outcome == 'success' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $writfsLog = Join-Path $env:RUNNER_TEMP 'writfs-windows-logs/library-tests.log'
          & $env:WRITFS_NODE (Join-Path $env:RUNNER_TEMP 'writfs-windows-generated/library-tests.js') 2>&1 |
            Tee-Object -FilePath $writfsLog
          $writfsExit = $LASTEXITCODE
          "Node exit status: $writfsExit" | Tee-Object -FilePath $writfsLog -Append
          exit $writfsExit

      - name: Run the Bend WritFS model tests
        id: model
        if: ${{ !cancelled() && steps.generated.outcome == 'success' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $writfsLog = Join-Path $env:RUNNER_TEMP 'writfs-windows-logs/writfs-model-tests.log'
          & $env:WRITFS_NODE (Join-Path $env:RUNNER_TEMP 'writfs-windows-generated/writfs-model-tests.js') 2>&1 |
            Tee-Object -FilePath $writfsLog
          $writfsExit = $LASTEXITCODE
          "Node exit status: $writfsExit" | Tee-Object -FilePath $writfsLog -Append
          exit $writfsExit

      - name: Summarize execution scope and results
        if: always()
        env:
          WRITFS_LIBRARY_RESULT: ${{ steps.library.outcome }}
          WRITFS_MODEL_RESULT: ${{ steps.model.outcome }}
        run: |
          @(
            '## Bend policy execution on Windows'
            ''
            'These are Bend-generated JavaScript tests executed by native Windows Node.'
            'Windows filesystem, native machine-code, and host-enforcement qualification remain separate.'
            ''
            '| Bend entry | Result |'
            '| --- | --- |'
            "| Tests.bend | $env:WRITFS_LIBRARY_RESULT |"
            "| writfs/Tests.bend | $env:WRITFS_MODEL_RESULT |"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Retain Windows execution logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: writfs-windows-policy-${{ github.run_attempt }}
          path: ${{ runner.temp }}/writfs-windows-logs/
          if-no-files-found: error
          retention-days: 14

  no-data:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/lane/windows-init-diagnostic' }}
    name: Isolated no-data observations (no confinement credit)
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Capture source and runner facts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $logs = Join-Path $env:RUNNER_TEMP 'windows-init-logs'
          New-Item -ItemType Directory -Force $logs | Out-Null
          @("source=$env:GITHUB_SHA", "runner=$env:ImageOS", "image=$env:ImageVersion", "os=$([Environment]::OSVersion.VersionString)", 'no_data=1 confinement_credit=none') |
            Out-File (Join-Path $logs 'environment.txt') -Encoding utf8
          Get-FileHash contrib/native-hosts/windows/init_diagnostic.c,contrib/native-hosts/windows/init_worker.c,contrib/native-hosts/windows/init_child.c,contrib/native-hosts/windows/init_report.h,contrib/native-hosts/windows/init_report_test.c,contrib/native-hosts/windows/pss_observer.c,contrib/native-hosts/windows/pss_child.c,contrib/native-hosts/windows/pss_table.c,contrib/native-hosts/windows/pss_table.h,contrib/native-hosts/windows/pss_table_test.c,contrib/native-hosts/windows/pss_progress.c,contrib/native-hosts/windows/pss_progress.h,contrib/native-hosts/windows/pss_progress_test.c,contrib/native-hosts/windows/init-diagnostic/CMakeLists.txt,contrib/native-hosts/windows/worker.c,contrib/native-hosts/windows/worker.h,contrib/native-hosts/windows/isolation.c,contrib/native-hosts/windows/isolation.h,contrib/native-hosts/windows/probe.h -Algorithm SHA256 |
            Format-List | Out-File (Join-Path $logs 'sources.txt') -Encoding utf8
      - name: Build standalone diagnostic with MSVC
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $logs = Join-Path $env:RUNNER_TEMP 'windows-init-logs'
          $build = Join-Path $env:RUNNER_TEMP 'windows-init-build'
          & cmake -S contrib/native-hosts/windows/init-diagnostic -B $build -A x64 2>&1 | Tee-Object -FilePath (Join-Path $logs 'configure.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Standalone configure failed.' }
          & cmake --build $build --config Release --parallel 2 2>&1 | Tee-Object -FilePath (Join-Path $logs 'build.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Standalone build failed.' }
          Get-FileHash (Join-Path $build 'Release\writfs-init-diagnostic.exe'),(Join-Path $build 'Release\writfs-init-report-test.exe'),(Join-Path $build 'Release\writfs-init-child.exe'),(Join-Path $build 'Release\writfs-pss-observer.exe'),(Join-Path $build 'Release\writfs-pss-child.exe'),(Join-Path $build 'Release\writfs-pss-table-test.exe'),(Join-Path $build 'Release\writfs-pss-progress-test.exe') -Algorithm SHA256 |
            Format-List | Out-File (Join-Path $logs 'binaries.txt') -Encoding utf8
      - name: Verify child PE dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $logs = Join-Path $env:RUNNER_TEMP 'windows-init-logs'
          $log = Join-Path $logs 'child-dependencies.txt'
          try {
            $child = Join-Path $env:RUNNER_TEMP 'windows-init-build\Release\writfs-init-child.exe'
            $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
            if (-not (Test-Path $vswhere) -or -not (Test-Path $child)) { throw 'vswhere or child image missing.' }
            $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            if ($LASTEXITCODE -ne 0 -or -not $vs) { throw 'MSVC installation not found.' }
            $devcmd = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
            $dumpbin = Get-ChildItem (Join-Path $vs 'VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe') | Sort-Object FullName -Descending | Select-Object -First 1
            if (-not (Test-Path $devcmd) -or -not $dumpbin) { throw 'Developer environment or dumpbin not found.' }
            $command = 'call "{0}" -no_logo -arch=x64 && "{1}" /dependents "{2}"' -f $devcmd,$dumpbin.FullName,$child
            $ErrorActionPreference = 'Continue'
            $dependencies = & cmd.exe /d /s /c $command 2>&1
            $dumpExit = $LASTEXITCODE
            $dependencies | Out-File $log -Encoding utf8
            if ($dumpExit -ne 0 -or -not ($dependencies -match '^\s*WS2_32\.dll\s*$') -or ($dependencies -match '^\s*(USER32|OLE32)\.dll\s*$')) {
              throw 'Child dependency inspection failed or includes USER32/OLE32.'
            }
          } catch {
            "Dependency inspection incomplete: $_" | Add-Content $log -Encoding utf8
            throw
          }
      - name: Run synthetic fixed-report test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $logs = Join-Path $env:RUNNER_TEMP 'windows-init-logs'
          $build = Join-Path $env:RUNNER_TEMP 'windows-init-build'
          & ctest --test-dir $build -C Release --output-on-failure 2>&1 | Tee-Object -FilePath (Join-Path $logs 'synthetic.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic report test failed.' }
      - name: Run standalone no-data observations
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $logs = Join-Path $env:RUNNER_TEMP 'windows-init-logs'
          $exe = Join-Path $env:RUNNER_TEMP 'windows-init-build\Release\writfs-init-diagnostic.exe'
          & $exe 2>&1 | Tee-Object -FilePath (Join-Path $logs 'diagnostic.txt')
          if ($LASTEXITCODE -ne 0) { throw 'No-data observation incomplete or cleanup failed.' }
      - name: Retain diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-init-no-data-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/windows-init-logs/
          if-no-files-found: error
          retention-days: 14

  pss-feasibility:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/lane/windows-pss' }}
    name: Isolated self-child PSS feasibility (no confinement credit)
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Capture PSS source and runner facts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $logs = Join-Path $env:RUNNER_TEMP 'windows-pss-logs'
          New-Item -ItemType Directory -Force $logs | Out-Null
          @("source=$env:GITHUB_SHA", "runner=$env:ImageOS", "image=$env:ImageVersion", "os=$([Environment]::OSVersion.VersionString)", 'self_created_child_only=1 no_data=1 confinement_credit=none') |
            Out-File (Join-Path $logs 'environment.txt') -Encoding utf8
          Get-FileHash contrib/native-hosts/windows/pss_observer.c,contrib/native-hosts/windows/pss_child.c,contrib/native-hosts/windows/pss_table.c,contrib/native-hosts/windows/pss_table.h,contrib/native-hosts/windows/pss_table_test.c,contrib/native-hosts/windows/pss_progress.c,contrib/native-hosts/windows/pss_progress.h,contrib/native-hosts/windows/pss_progress_test.c,contrib/native-hosts/windows/init-diagnostic/CMakeLists.txt -Algorithm SHA256 |
            Format-List | Out-File (Join-Path $logs 'sources.txt') -Encoding utf8
      - name: Build fixed PSS feasibility targets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $logs = Join-Path $env:RUNNER_TEMP 'windows-pss-logs'
          $build = Join-Path $env:RUNNER_TEMP 'windows-pss-build'
          & cmake -S contrib/native-hosts/windows/init-diagnostic -B $build -A x64 2>&1 | Tee-Object -FilePath (Join-Path $logs 'configure.txt')
          if ($LASTEXITCODE -ne 0) { throw 'PSS configuration failed.' }
          & cmake --build $build --config Release --parallel 2 --target writfs-pss-observer writfs-pss-child writfs-pss-table-test writfs-pss-progress-test 2>&1 | Tee-Object -FilePath (Join-Path $logs 'build.txt')
          if ($LASTEXITCODE -ne 0) { throw 'PSS build failed.' }
          $ErrorActionPreference = 'Stop'
          $binaryHashes = @(Get-FileHash (Join-Path $build 'Release\writfs-pss-observer.exe'),(Join-Path $build 'Release\writfs-pss-child.exe'),(Join-Path $build 'Release\writfs-pss-table-test.exe'),(Join-Path $build 'Release\writfs-pss-progress-test.exe') -Algorithm SHA256)
          if ($binaryHashes.Count -ne 4) { throw 'Expected all four PSS binary hashes.' }
          $binaryHashes | Format-List | Out-File (Join-Path $logs 'binaries.txt') -Encoding utf8
      - name: Run synthetic PSS classifiers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $logs = Join-Path $env:RUNNER_TEMP 'windows-pss-logs'
          $build = Join-Path $env:RUNNER_TEMP 'windows-pss-build'
          $results = & ctest --test-dir $build -C Release -R '^pss-.*-synthetic$' --no-tests=error --output-on-failure 2>&1
          $testExit = $LASTEXITCODE
          $results | Tee-Object -FilePath (Join-Path $logs 'synthetic.txt')
          if ($testExit -ne 0 -or -not ($results -match 'pss-table-synthetic') -or -not ($results -match 'pss-progress-synthetic')) {
            throw 'Both synthetic PSS classifier tests must run and pass.'
          }
      - name: Observe fixed suspended synthetic child
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $logs = Join-Path $env:RUNNER_TEMP 'windows-pss-logs'
          $exe = Join-Path $env:RUNNER_TEMP 'windows-pss-build\Release\writfs-pss-observer.exe'
          $statusLog = Join-Path $logs 'supervision.txt'
          try {
            $process = Start-Process -FilePath $exe -PassThru -NoNewWindow `
              -RedirectStandardOutput (Join-Path $logs 'observer-stdout.txt') `
              -RedirectStandardError (Join-Path $logs 'observer-stderr.txt')
            if (-not $process.WaitForExit(30000)) {
              'timeout=1 observer_termination=attempting cleanup=unverified' | Out-File $statusLog -Encoding utf8
              try {
                $process.Kill()
                'observer_termination=requested' | Add-Content $statusLog -Encoding utf8
              } catch {
                "observer_termination=failed detail=$_" | Add-Content $statusLog -Encoding utf8
              }
              $retired = $process.WaitForExit(5000)
              "observer_exit_observed=$retired child_cleanup=unverified vm_teardown=fallback" | Add-Content $statusLog -Encoding utf8
              throw 'PSS observer timed out; scoped cleanup is unverified.'
            }
            $process.Refresh()
            "timeout=0 observer_exit=$($process.ExitCode)" | Out-File $statusLog -Encoding utf8
            if ($process.ExitCode -ne 0) { throw 'PSS observation incomplete or cleanup failed.' }
          } catch {
            "PSS supervision incomplete: $_" | Add-Content $statusLog -Encoding utf8
            throw
          }
      - name: Retain PSS evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-pss-no-data-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/windows-pss-logs/
          if-no-files-found: error
          retention-days: 14

  pss-lpac-feasibility:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/lane/windows-pss-lpac' }}
    name: Isolated no-data LPAC PSS feasibility (no confinement credit)
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Capture LPAC PSS source and runner facts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $logs = Join-Path $env:RUNNER_TEMP 'windows-pss-lpac-logs'
          New-Item -ItemType Directory -Force $logs | Out-Null
          @("source=$env:GITHUB_SHA", "runner=$env:ImageOS", "image=$env:ImageVersion", "os=$([Environment]::OSVersion.VersionString)", 'self_created_child_only=1 no_data=1 confinement_credit=none') |
            Out-File (Join-Path $logs 'environment.txt') -Encoding utf8
          Get-FileHash contrib/native-hosts/windows/pss_lpac_observer.c,contrib/native-hosts/windows/pss_lpac_progress.c,contrib/native-hosts/windows/pss_lpac_progress.h,contrib/native-hosts/windows/pss_lpac_progress_test.c,contrib/native-hosts/windows/pss_child.c,contrib/native-hosts/windows/pss_table.c,contrib/native-hosts/windows/pss_table.h,contrib/native-hosts/windows/pss_table_test.c,contrib/native-hosts/windows/pss_progress.c,contrib/native-hosts/windows/pss_progress.h,contrib/native-hosts/windows/pss_progress_test.c,contrib/native-hosts/windows/init_worker.c,contrib/native-hosts/windows/worker.c,contrib/native-hosts/windows/worker.h,contrib/native-hosts/windows/isolation.c,contrib/native-hosts/windows/isolation.h,contrib/native-hosts/windows/probe.h,contrib/native-hosts/windows/init-diagnostic/CMakeLists.txt -Algorithm SHA256 |
            Format-List | Out-File (Join-Path $logs 'sources.txt') -Encoding utf8
      - name: Build fixed LPAC PSS feasibility targets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $logs = Join-Path $env:RUNNER_TEMP 'windows-pss-lpac-logs'
          $build = Join-Path $env:RUNNER_TEMP 'windows-pss-lpac-build'
          & cmake -S contrib/native-hosts/windows/init-diagnostic -B $build -A x64 2>&1 | Tee-Object -FilePath (Join-Path $logs 'configure.txt')
          if ($LASTEXITCODE -ne 0) { throw 'PSS configuration failed.' }
          & cmake --build $build --config Release --parallel 2 --target writfs-pss-lpac-observer writfs-pss-child writfs-pss-table-test writfs-pss-progress-test writfs-pss-lpac-progress-test 2>&1 | Tee-Object -FilePath (Join-Path $logs 'build.txt')
          if ($LASTEXITCODE -ne 0) { throw 'PSS build failed.' }
          $ErrorActionPreference = 'Stop'
          $binaryHashes = @(Get-FileHash (Join-Path $build 'Release\writfs-pss-lpac-observer.exe'),(Join-Path $build 'Release\writfs-pss-child.exe'),(Join-Path $build 'Release\writfs-pss-table-test.exe'),(Join-Path $build 'Release\writfs-pss-progress-test.exe'),(Join-Path $build 'Release\writfs-pss-lpac-progress-test.exe') -Algorithm SHA256)
          if ($binaryHashes.Count -ne 5) { throw 'Expected all five LPAC PSS binary hashes.' }
          $binaryHashes | Format-List | Out-File (Join-Path $logs 'binaries.txt') -Encoding utf8
      - name: Run synthetic LPAC PSS classifiers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $logs = Join-Path $env:RUNNER_TEMP 'windows-pss-lpac-logs'
          $build = Join-Path $env:RUNNER_TEMP 'windows-pss-lpac-build'
          $results = & ctest --test-dir $build -C Release -R '^pss-.*-synthetic$' --no-tests=error --output-on-failure 2>&1
          $testExit = $LASTEXITCODE
          $results | Tee-Object -FilePath (Join-Path $logs 'synthetic.txt')
          if ($testExit -ne 0 -or -not ($results -match 'pss-table-synthetic') -or -not ($results -match 'pss-progress-synthetic') -or -not ($results -match 'pss-lpac-progress-synthetic')) {
            throw 'All three synthetic LPAC PSS classifier tests must run and pass.'
          }
      - name: Observe fixed suspended no-data LPAC child
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $logs = Join-Path $env:RUNNER_TEMP 'windows-pss-lpac-logs'
          $exe = Join-Path $env:RUNNER_TEMP 'windows-pss-lpac-build\Release\writfs-pss-lpac-observer.exe'
          $statusLog = Join-Path $logs 'supervision.txt'
          try {
            $process = Start-Process -FilePath $exe -PassThru -NoNewWindow `
              -RedirectStandardOutput (Join-Path $logs 'observer-stdout.txt') `
              -RedirectStandardError (Join-Path $logs 'observer-stderr.txt')
            if (-not $process.WaitForExit(30000)) {
              'timeout=1 observer_termination=attempting cleanup=unverified' | Out-File $statusLog -Encoding utf8
              try {
                $process.Kill()
                'observer_termination=requested' | Add-Content $statusLog -Encoding utf8
              } catch {
                "observer_termination=failed detail=$_" | Add-Content $statusLog -Encoding utf8
              }
              $retired = $process.WaitForExit(5000)
              "observer_exit_observed=$retired child_cleanup=unverified vm_teardown=fallback" | Add-Content $statusLog -Encoding utf8
              throw 'LPAC PSS observer timed out; scoped cleanup is unverified.'
            }
            $process.Refresh()
            "timeout=0 observer_exit=$($process.ExitCode)" | Out-File $statusLog -Encoding utf8
            if ($process.ExitCode -ne 0) { throw 'LPAC PSS observation incomplete or cleanup failed.' }
          } catch {
            "PSS supervision incomplete: $_" | Add-Content $statusLog -Encoding utf8
            throw
          }
      - name: Retain PSS evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-pss-lpac-no-data-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/windows-pss-lpac-logs/
          if-no-files-found: error
          retention-days: 14

